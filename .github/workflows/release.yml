name: Release

# Costruisce CastVoice per Linux, Windows e macOS e pubblica la release.
# Parte quando si pubblica un'etichetta di versione (es. v1.1.0) oppure a mano da «Actions».
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux }     # glibc vecchia: l'AppImage gira anche su distribuzioni non recenti
          - { os: windows-latest, name: windows }
          - { os: macos-latest, name: macos-arm64 }     # Apple Silicon
          - { os: macos-15-intel, name: macos-intel }   # Mac con processore Intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Librerie di sistema per Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Dipendenze
        run: python -m pip install -r requirements.txt pyinstaller pillow

      - name: Impacchetta e prova l'app (python packaging/build.py)
        run: python packaging/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: castvoice-${{ matrix.name }}
          path: dist-release/*
          if-no-files-found: error

  release:
    name: Pubblica la release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Crea la release su GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'EOF'
          ## Scarica

          | Sistema | File |
          |---|---|
          | **Linux** (x86_64) | `CastVoice-*-x86_64.AppImage` — rendilo eseguibile (tasto destro → Proprietà → «Permetti di eseguire») e doppio clic |
          | **Windows** (64 bit) | `CastVoice-*-windows-x64.zip` — estrai la cartella e apri `CastVoice.exe` |
          | **macOS** (Apple Silicon) | `CastVoice-*-macos-arm64.zip` — estrai e apri `CastVoice.app` (la prima volta: tasto destro → Apri) |
          | **Android** | `CastVoice-*.apk` — copialo sul telefono e consenti «installa app sconosciute» |

          ffmpeg è già incluso, non serve installare altro. Windows e macOS non sono firmati: il sistema può mostrare un avviso la prima volta.
          La clonazione della voce usa `uv` (https://docs.astral.sh/uv/) per installare il motore dalla scheda «La mia voce» e funziona con una GPU NVIDIA.

          Software incluso: ffmpeg (GPL), Qt/PySide6 (LGPL). Vedi `THIRD_PARTY_NOTICES.md`.
          EOF
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" --title "CastVoice ${GITHUB_REF_NAME#v}" --notes-file notes.md
